name: Expo EAS Android Build from PR label

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      profile:
        description: EAS Android build profile from eas.json
        required: true
        default: preview
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.label.name, 'eas-build-android')
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out selected ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5

      - name: Parse Android build profile from PR label
        if: github.event_name == 'pull_request'
        id: pr_target
        env:
          BUILD_LABEL: ${{ github.event.label.name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          label = os.environ["BUILD_LABEL"]
          match = re.fullmatch(r"eas-build-android(?::([A-Za-z0-9_-]+))?", label)
          if not match:
              print(f"Unsupported Android build label: {label!r}. Expected eas-build-android[:<profile>].", file=sys.stderr)
              sys.exit(1)

          profile = match.group(1) or "production"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"profile={profile}\n")
          PY

      - name: Set manual build profile
        if: github.event_name == 'workflow_dispatch'
        id: manual_target
        env:
          PROFILE: ${{ inputs.profile }}
        run: echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Select build profile
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_PROFILE: ${{ steps.pr_target.outputs.profile }}
          MANUAL_PROFILE: ${{ steps.manual_target.outputs.profile }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "profile=$PR_PROFILE" >> "$GITHUB_OUTPUT"
          else
            echo "profile=$MANUAL_PROFILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate EAS Android profile and token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ steps.target.outputs.profile }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "Configure the EXPO_TOKEN repository secret first." && exit 1)
          node -e 'const c=require("./eas.json"); const p=c.build[process.env.PROFILE]; if (!p || !p.android) { console.error(`Unknown or non-Android EAS profile: ${process.env.PROFILE}`); process.exit(1); }'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start Android EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ steps.target.outputs.profile }}
        run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
