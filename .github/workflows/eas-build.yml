name: Android APK (GitHub runner)

on:
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "app/**"
      - "lib/**"
      - "components/**"
      - "app.config.ts"
      - "eas.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "assets/**"
      - ".github/workflows/eas-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK locally
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Require Expo token
        run: test -n "$EXPO_TOKEN" || (echo "Configure the EXPO_TOKEN repository secret for EAS authentication and credentials." && exit 1)

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate release version
        shell: bash
        run: |
          base_version=$(grep -oP 'appVersionBase = "\K[0-9]+\.[0-9]+\.[0-9]+' app.config.ts | head -n 1)
          IFS='.' read -r major minor base_patch <<< "$base_version"
          patch=$GITHUB_RUN_NUMBER
          if (( patch <= base_patch )); then patch=$((base_patch + GITHUB_RUN_NUMBER)); fi
          app_version="$major.$minor.$patch"
          version_code=$((100000 + GITHUB_RUN_NUMBER))
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$app_version" >> "$GITHUB_ENV"
          echo "Building NetADB $app_version (versionCode $version_code)"

      - name: Configure Gradle memory for GitHub runner
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          cat > "$gradle_user_home/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

      - name: Build Android production APK on this runner
        run: eas build --platform android --profile production-apk --local --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netadb-android-apk
          path: ${{ github.workspace }}/artifacts/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          apks=(artifacts/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one APK in artifacts/, found ${#apks[@]}"
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${apks[0]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${apks[0]}" \
              --title "NetADB $APP_VERSION" \
              --generate-notes
          fi
