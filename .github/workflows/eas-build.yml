name: Android APK (GitHub runner)

on:
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "app.config.ts"
      - "eas.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "assets/**"
      - ".github/workflows/eas-build.yml"
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK locally
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Require Expo token
        run: test -n "$EXPO_TOKEN" || (echo "Configure the EXPO_TOKEN repository secret for EAS authentication and credentials." && exit 1)

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android production APK on this runner
        run: eas build --platform android --profile production-apk --local --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netadb-android-apk
          path: ${{ github.workspace }}/artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
